<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111e"><link rel="manifest" href="/manifest.webmanifest"><title>FlowScope BTC</title><style>
:root{--bg:#07111e;--card:#101a29;--text:#eef3f8;--muted:#8fa0b4;--line:#213047;--green:#22d39a;--red:#ff6674;--amber:#f3b44e}*{box-sizing:border-box}body{margin:0;background:#07111e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:430px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 92px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:21px;font-weight:900}.live{font-size:11px;border:1px solid #26425f;border-radius:999px;padding:5px 8px;color:#9cb0c6}.ok{color:#65e0b3;border-color:#1d5a49;background:#0c2d25}.bad{color:#ff9ca5;border-color:#67333d;background:#31171d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:4px;background:#0d1724;border:1px solid var(--line);border-radius:11px;margin-bottom:11px}.tabs button{background:transparent;border:0;color:var(--muted);padding:9px;border-radius:8px;font-weight:800}.tabs .active{background:#1b2b41;color:#fff}.card{background:linear-gradient(180deg,#101a29,#0d1724);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}.k{font-size:10px;letter-spacing:.13em;color:#8ea2b9;font-weight:800}.price{font-size:26px;font-weight:900;margin-top:5px}.regime{font-size:25px;font-weight:900;line-height:1.08;margin:6px 0}.muted{font-size:12px;color:var(--muted)}.interp h3{font-size:19px;margin:5px 0 7px}.interp p{font-size:14px;line-height:1.4;margin:0;color:#dce5ed}.rules{border-top:1px solid #1c2b3e;margin-top:10px;padding-top:8px;color:#aebbd0;font-size:12px}.rules div{margin:5px 0}.row{display:grid;grid-template-columns:95px 1fr auto;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid #19283a}.row:last-child{border:0}.name{font-size:12px;font-weight:900}.v{font-size:10px;color:#9aacc1;text-align:right}.pill{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;display:inline-block}.pos{background:#10382f;color:#69e3b8}.neg{background:#381820;color:#ff929c}.neu{background:#1b2736;color:#c3ceda}.warn{background:#3c2b13;color:#ffd187}.off{background:#242a33;color:#8995a5}.err{font-size:11px;color:#ff9ca5;white-space:pre-wrap}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);background:rgba(7,17,30,.97);border-top:1px solid #1a293d}.nav div{text-align:center;color:#71839a;font-size:9px}.nav .active{color:#fff}.ico{display:block;font-size:18px}.section{display:flex;justify-content:space-between;margin:4px 2px 8px}.section b{font-size:13px}.section span{font-size:10px;color:var(--muted)}
</style></head><body><div class="app"><div class="head"><div class="brand">₿ FlowScope BTC</div><div id="live" class="live">CONNECTING</div></div><div class="tabs" id="tabs"><button data-tf="1h">1H</button><button data-tf="4h" class="active">4H</button><button data-tf="1d">1D</button><button data-tf="1w">1W</button></div><div class="card"><div class="k">BTCUSDT</div><div id="price" class="price">—</div><div id="time" class="muted">—</div></div><div class="card"><div class="k">CURRENT REGIME</div><div id="regime" class="regime">Loading…</div><div id="conf" class="muted">Confidence: —</div></div><div class="card interp"><div class="k">ИНТЕРПРЕТАЦИЯ</div><h3 id="title">Подключаем рынок</h3><p id="text">Загрузка реальных данных.</p><div class="rules"><div><b>Подтверждение:</b> <span id="confirm">—</span></div><div><b>Отмена:</b> <span id="cancel">—</span></div></div></div><div class="section"><b>Flow summary</b><span>cloud live</span></div><div class="card" style="padding-top:2px;padding-bottom:2px"><div class="row"><div class="name">ETF</div><div id="etfs"></div><div id="etfv" class="v"></div></div><div class="row"><div class="name">SPOT</div><div id="spots"></div><div id="spotv" class="v"></div></div><div class="row"><div class="name">FUTURES</div><div id="futs"></div><div id="futv" class="v"></div></div><div class="row"><div class="name">OPEN INTEREST</div><div id="ois"></div><div id="oiv" class="v"></div></div><div class="row"><div class="name">FUNDING</div><div id="funds"></div><div id="fundv" class="v"></div></div></div><div id="err" class="err"></div></div><div class="nav"><div class="active"><span class="ico">◉</span>Pulse</div><div><span class="ico">≋</span>Flow</div><div><span class="ico">⇄</span>Div</div><div><span class="ico">◇</span>Regime</div><div><span class="ico">◷</span>History</div></div><script>
let tf='4h'; const $=x=>document.getElementById(x); const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;function render(d){$('price').textContent='$'+Number(d.price).toLocaleString(undefined,{maximumFractionDigits:0});$('time').textContent='Updated '+new Date(d.ts*1000).toLocaleTimeString();const r=d.regime;$('regime').textContent=r.regime;$('conf').textContent='Confidence: '+r.confidence;$('title').textContent=r.title;$('text').textContent=r.text;$('confirm').textContent=r.confirm;$('cancel').textContent=r.cancel;$('spots').innerHTML=pill(d.spot.status,d.spot.cls);$('spotv').textContent='z '+d.spot.z.toFixed(2);$('futs').innerHTML=pill(d.futures.status,d.futures.cls);$('futv').textContent='z '+d.futures.z.toFixed(2);$('ois').innerHTML=pill(d.oi.status,d.oi.cls);$('oiv').textContent=d.oi.change==null?'—':((d.oi.change>=0?'+':'')+d.oi.change.toFixed(2)+'%');$('funds').innerHTML=pill(d.funding.status,d.funding.cls);$('fundv').textContent=d.funding.rate==null?'—':(d.funding.rate*100).toFixed(4)+'%';$('etfs').innerHTML=pill(d.etf.status,d.etf.cls||'off');$('etfv').textContent=d.etf.daily==null?'—':((d.etf.daily>=0?'+':'')+d.etf.daily.toFixed(1)+'M');$('err').textContent=d.errors?.length?d.errors.join('\n'):''}async function refresh(){$('live').textContent='UPDATING';$('live').className='live';try{const r=await fetch('/api/state?tf='+tf,{cache:'no-store'});const d=await r.json();if(!d.ok)throw new Error((d.errors||[]).join('; '));render(d);$('live').textContent='LIVE';$('live').className='live ok'}catch(e){$('live').textContent='ERROR';$('live').className='live bad';$('err').textContent=String(e)}}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tf=b.dataset.tf;refresh()});if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}refresh();setInterval(refresh,60000);
</script></body></html>
