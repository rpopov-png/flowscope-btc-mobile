services:
  - type: web
    name: flowscope-btc
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowscope-btc-db
          property: connectionString
      - key: COINGLASS_API_KEY
        sync: false
      - key: COLLECT_INTERVAL_SECONDS
        value: "60"
    autoDeployTrigger: commit

databases:
  - name: flowscope-btc-db
    plan: basic-256mb
